<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmed | Laptopia</title><link rel="stylesheet" href="css/style.css">
</head><body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WD82LCK3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div id="header"></div>
<section><div class="container" style="text-align:center;max-width:720px">
  <div id="msg"></div>
  <p style="margin-top:28px"><a class="btn" href="products.html">Continue Shopping</a></p>
</div></section>
<div id="footer"></div>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
renderLayout("confirmation");
const o = LP.read(LP.OKEY, null), box = document.getElementById("msg");
if (!o) {
  box.innerHTML = "<h1>No recent order found</h1><p>Browse our laptops to place an order.</p>";
} else {
  box.innerHTML = `<h1>Order Confirmed!</h1>
    <p>Thank you, ${LP.esc(o.name)}. A confirmation will be sent to ${LP.esc(o.email)}.</p>
    <div style="border:1px solid #ddd;padding:24px;text-align:left;line-height:1.9">
      <b>Order number:</b> ${LP.esc(o.id)}<br>
      <b>Items:</b> ${o.items.map(i=>LP.esc(i.item_name)+" × "+i.quantity).join(", ")}<br>
      <b>Total:</b> ${LP.fmt(o.total)} (${LP.esc(o.payment)})<br>
      <b>Deliver to:</b> ${LP.esc(o.address)}, ${LP.esc(o.city)}, ${LP.esc(o.country)}
    </div>`;
  // GA4: purchase — fires once per order, no personal data sent
  if (!o.tracked) {
    LP.push("purchase", { transaction_id:o.id, currency:"USD", value:o.total, shipping:0, items:o.items });
    o.tracked = true;
    LP.write(LP.OKEY, o);
  }
}
</script>
</body></html>
