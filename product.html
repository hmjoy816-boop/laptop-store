<title>Laptop | Laptopia</title><link rel="stylesheet" href="css/style.css">
</head><body>

<!-- Google Tag Manager (noscript) -->

<div id="header"></div>
<section><div class="container">
  <div class="crumbs" id="crumbs"></div>
  <div class="product" id="product"></div>
</div></section>
<section class="alt"><div class="container">
  <h2 class="title">You may also like</h2><p class="sub">&nbsp;</p>
  <div class="grid" id="related"></div>
</div></section>
<div id="footer"></div>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
renderLayout("product");
const id = +new URLSearchParams(location.search).get("id") || 1;
const p = PRODUCTS.find(x=>x.id===id) || PRODUCTS[0];
document.title = p.name + " | Laptopia";
document.getElementById("crumbs").innerHTML = `<a href="index.html">Home</a> / <a href="products.html">Laptops</a> / ${p.name}`;
document.getElementById("product").innerHTML = `
  <img class="main-img" src="${p.image}" alt="${p.name}" onerror="this.onerror=null;this.src=FALLBACK">
  <div>
    <small style="color:#6b6b6b;text-transform:uppercase;letter-spacing:1px">${p.category}</small>
    <h1>${p.name}</h1>
    <div class="price">${money(p.price)}</div>
    <p class="desc">${p.desc}</p>
    <table class="specs">${Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>
    <p style="margin:20px 0 12px"><label>Quantity <select id="qty" style="padding:8px;margin-left:8px">
      ${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select></label></p>
    <button class="btn" id="addBtn" style="border:0;cursor:pointer;font:inherit;font-weight:700">Add to Cart</button>
  </div>`;
document.getElementById("related").innerHTML = PRODUCTS.filter(x=>x.id!==p.id).slice(0,4).map(cardHTML).join("");

document.getElementById("addBtn").addEventListener("click", function(){
  Cart.add(p.id, document.getElementById("qty").value);
});

// GA4: view_item
LP.push("view_item", { currency: "USD", value: p.price, items: [LP.gaItem(p, 1)] });
</script>
</body></html>
